# Site settings
title: "Damon Driscoll"
description: "Damon Driscoll's resume site."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Damon Driscoll"
resume_title:                   "VP of Global Communications"

resume_header_intro: "<p>I am driven by a passion for technology and problem-solving, with experience in IT support. I thrive on tackling complex challenges and am eager to continuously learn and grow within dynamic tech environments. My focus is on leveraging my skills to contribute to innovative projects and advance my career in the tech industry.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
# resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_certifications:  true
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/damondriscoll"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/damondriscoll/"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "https://damondriscoll.com/"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

